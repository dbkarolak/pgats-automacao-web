name: Cypress Tests

on:
  push:
    branches:
      - developer
      - production

  pull_request:
    branches:
      - production

  workflow_dispatch:

jobs:
  cypress-run:
    name: Cypress E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          install-command: npm ci

      - name: Upload Cypress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-report
          path: cypress/reports
          if-no-files-found: warn